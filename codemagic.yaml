workflows:
  ios-testflight:
    name: iOS — TestFlight only
    instance_type: mac_mini_m2
    max_build_duration: 90

    integrations:
      app_store_connect: Iraq Pharma Guide

    environment:
      flutter: 3.41.8
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.iraqpharmaguide.iraqPharmaGuide

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: release/3.0
          include: true
          source: true

    scripts:
      - name: Flutter packages get
        script: flutter packages pub get

      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # TestFlight فقط — لا إرسال لمراجعة App Store.
        # بعد موافقة د. حميد على أداء التطبيق نُحوّل submit_to_app_store إلى true.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - hameedalkubaisi96@gmail.com
        notify:
          success: true
          failure: true
