workflows:

  # ═══════════════════════════════════════════════════════════════════
  # iOS → TestFlight
  # ═══════════════════════════════════════════════════════════════════
  ios-testflight:
    name: iOS — TestFlight only
    instance_type: mac_mini_m2
    max_build_duration: 90

    integrations:
      app_store_connect: Iraq Pharma Guide

    environment:
      flutter: 3.41.8
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.iraqpharmaguide.iraqPharmaGuide"
        APP_STORE_APPLE_ID: "6800479716"

    triggering:
      events:
        - push
      branch_patterns:
        # كان مثبّتاً على release/3.0 فلم يكن البناء ينطلق من release/3.1.
        # النجمة تغطّي كل فروع الإصدارات القادمة بلا تعديل في كل مرّة.
        - pattern: release/*
          include: true
          source: true

    scripts:
      # شهادة التوزيع القديمة مفتاحها الخاص على جهاز ماك آخر، فلا يستطيع
      # Codemagic استعمالها. هنا يُولَّد مفتاح خاص جديد، وبه تُنشأ شهادة توزيع
      # وبروفايل App Store، ثم يُربطان بمشروع Xcode.
      - name: Set up code signing
        script: |
          set -e
          keychain initialize

          # آبل تسمح بثلاث شهادات توزيع فقط. توليد مفتاح جديد في كل بناء
          # يُنشئ شهادة جديدة في كل مرّة، فتمتلئ الحصّة ويفشل البناء بـ 409.
          # الحلّ: مفتاح خاص واحد ثابت محفوظ في متغيّرات Codemagic باسم
          # CERTIFICATE_PRIVATE_KEY، فتُعاد الشهادة نفسها بلا إنشاء جديد.
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
            echo "استُعمل المفتاح الخاص المحفوظ"
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key=@file:/tmp/cert_key.pem \
              --create
          else
            echo "لا مفتاح محفوظ — سيُولَّد مفتاح وشهادة جديدان لهذا البناء"
            # تنظيف: شهادات التوزيع التي أنشأتها أبنية سابقة ضاع مفتاحها مع
            # آلة البناء، فلا نفع منها وتملأ حصّة آبل (3 شهادات). تُحذف هنا كل
            # شهادة توزيع تنتهي في 2027-11-20 أو بعده، أي أُنشئت من
            # 2026-11-20 فصاعداً. شهادة 2027-08-11 الأقدم لا تُمسّ.
            # (بموافقة د. حميد، 2026-11-21)
            app-store-connect certificates list --json > /tmp/certs.json 2>/tmp/certs.err || true
            python3 - <<'PY' > /tmp/stale_cert_ids.txt || true
          import json, sys
          raw = open('/tmp/certs.json', encoding='utf-8', errors='ignore').read()
          try:
              data = json.loads(raw)
          except Exception:
              a, b = raw.find('['), raw.rfind(']')
              data = json.loads(raw[a:b + 1]) if a >= 0 and b > a else []
          if isinstance(data, dict):
              data = data.get('data', [])
          for c in data:
              at = c.get('attributes', c)
              typ = str(at.get('certificateType', at.get('certificate_type', '')))
              exp = str(at.get('expirationDate', at.get('expiration_date', '')))[:10]
              print('cert', c.get('id'), typ, exp, file=sys.stderr)
              if typ.endswith('DISTRIBUTION') and typ in ('DISTRIBUTION', 'IOS_DISTRIBUTION') \
                      and exp >= '2027-11-20' and c.get('id'):
                  print(c['id'])
          PY
            while read -r CID; do
              [ -n "$CID" ] || continue
              echo "حذف شهادة توزيع من بناء سابق: $CID"
              app-store-connect certificates delete "$CID" --ignore-not-found || true
            done < /tmp/stale_cert_ids.txt
            openssl genrsa -out /tmp/cert_key.pem 2048
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key=@file:/tmp/cert_key.pem \
              --create
          fi

          keychain add-certificates
          xcode-project use-profiles

      - name: Flutter packages get
        script: flutter packages pub get

      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;

      - name: Flutter build ipa
        script: |
          # رقم البناء: الأكبر بين رقم pubspec وآخر رقم على TestFlight + 1،
          # حتى لا يرفض App Store Connect الرفع بسبب رقم مكرّر.
          PUB=$(grep '^version:' pubspec.yaml | sed 's/.*+//' | tr -cd '0-9')
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -1 | tr -cd '0-9' || true)
          BN=$(( ${LATEST:-0} + 1 ))
          if [ "$BN" -lt "${PUB:-1}" ]; then BN=$PUB; fi
          echo "رقم البناء: $BN (pubspec: $PUB، آخر TestFlight: ${LATEST:-لا يوجد})"
          flutter build ipa --release --build-number="$BN" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # TestFlight فقط — لا إرسال لمراجعة App Store.
        # بعد موافقة د. حميد نُحوّل submit_to_app_store إلى true.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - hameedalkubaisi96@gmail.com
        notify:
          success: true
          failure: true

  # ═══════════════════════════════════════════════════════════════════
  # Android → APK للفحص المباشر على الهاتف
  # ═══════════════════════════════════════════════════════════════════
  android-test:
    name: Android — APK للفحص
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.41.8
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: release/*
          include: true
          source: true

    scripts:
      # مفتاح التوقيع ليس في المستودع (وهذا صحيح، فهو سرّ). إن أُضيف
      # في Codemagic تحت مجموعة keystore_reference يُستعمل، وإلا يرجع
      # gradle تلقائياً إلى توقيع debug — وهو كافٍ تماماً لتثبيت النسخة
      # على الهاتف والفحص، وغير صالح للرفع إلى Google Play.
      # ملف google-services.json مستثنى من git (سطر 58 في .gitignore)
      # فلا يصل إلى آلة البناء، و Gradle يفشل بدونه. يُحقن من متغيّر
      # GOOGLE_SERVICES_JSON في Codemagic (محتوى الملف كما هو، أو base64).
      - name: Restore google-services.json
        script: |
          F="$CM_BUILD_DIR/android/app/google-services.json"
          if [ -f "$F" ]; then
            echo "الملف موجود في المستودع"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if echo "$GOOGLE_SERVICES_JSON" | head -c 1 | grep -q '{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > "$F"
            else
              echo "$GOOGLE_SERVICES_JSON" | base64 --decode > "$F"
            fi
            echo "أُنشئ من متغيّر البيئة"
            python3 -c "import json,sys; d=json.load(open('$F')); print('package:', [c['client_info']['android_client_info']['package_name'] for c in d['client']])"
          else
            # لا ملف ولا متغيّر: يُبنى الملف من lib/firebase_options.dart
            # الموجود في المستودع (المفتاح والمشروع أنفسهما)، مع معرّف تطبيق
            # أندرويد المسجّل في Firebase للحزمة com.iraqpharmaguide.app.
            python3 - "$F" "$CM_BUILD_DIR/lib/firebase_options.dart" <<'PY'
          import re, json, sys
          s = open(sys.argv[2], encoding='utf-8').read()
          blk = re.search(r'android\s*=\s*FirebaseOptions\((.*?)\);', s, re.S).group(1)
          g = lambda k: re.search(k + r":\s*'([^']+)'", blk).group(1)
          d = {
              "project_info": {"project_number": g('messagingSenderId'),
                               "project_id": g('projectId'),
                               "storage_bucket": g('storageBucket')},
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:1411929971:android:e9ae6f3d36702914449706",
                      "android_client_info": {"package_name": "com.iraqpharmaguide.app"}},
                  "oauth_client": [],
                  "api_key": [{"current_key": g('apiKey')}],
                  "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
              "configuration_version": "1"}
          json.dump(d, open(sys.argv[1], 'w'), indent=2)
          print('وُلّد google-services.json للحزمة com.iraqpharmaguide.app')
          PY
          fi

      - name: Set up signing if a keystore is configured
        script: |
          if [ -n "$CM_KEYSTORE_PATH" ]; then
            echo "keystore موجود — سيُستعمل للتوقيع"
            cat > "$CM_BUILD_DIR/android/key.properties" <<KP
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          KP
          else
            echo "لا keystore — سيُبنى بتوقيع debug للفحص فقط"
          fi

      - name: Flutter packages get
        script: flutter packages pub get

      - name: Flutter analyze
        script: flutter analyze --no-fatal-warnings --no-fatal-infos
        ignore_failure: true

      - name: Build APK
        script: flutter build apk --release

      - name: Build app bundle
        script: flutter build appbundle --release
        ignore_failure: true

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/**/*.aab
      - build/app/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - hameedalkubaisi96@gmail.com
        notify:
          success: true
          failure: true
